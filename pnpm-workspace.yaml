# Save exact versions without ^/~ ranges.
saveExact: true

# Hoist dependencies for tools that expect flat node_modules.
shamefullyHoist: true

# Auto-install resolvable peer dependencies.
autoInstallPeers: true

# Fail install on invalid or missing peer dependencies.
strictPeerDependencies: true

# Disable pnpm minimum release age checks for this workspace.
minimumReleaseAge: 0

# Do not auto-run install before scripts.
verifyDepsBeforeRun: false

packages:
  - packages/*
  - packages/*/playground

overrides:
  unrun: 0.3.1
  tsdown: 0.22.3

allowBuilds:
  '@parcel/watcher': true
  '@tailwindcss/oxide': true
  argon2: true
  esbuild: true
  nx: true
  sharp: true
  vue-demi: true

# Temporary TypeScript 6 compatibility allowance for build tooling, until upstream peer ranges declare TS6 support.
peerDependencyRules:
  allowedVersions:
    tsconfck>typescript: 6.0.3
    unbuild>typescript: 6.0.3
    '@nuxt/module-builder>typescript': 6.0.3
