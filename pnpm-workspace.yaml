# Save exact dependency versions
saveExact: true

# Hoist dependencies for tools that require flat node_modules
shamefullyHoist: true

# Auto-install resolvable peer dependencies
autoInstallPeers: true

# Disable minimum package release age
minimumReleaseAge: 0

# Do not auto-install before running scripts
verifyDepsBeforeRun: false

# Fail on invalid or missing peer dependencies
strictPeerDependencies: true

packages:
  - packages/*
  - packages/*/playground

registries:
  '@meawkit': https://npm.pkg.github.com/

overrides:
  # Temporary compatibility fixes
  '@napi-rs/wasm-runtime@': 1.1.6

peerDependencyRules:
  allowedVersions:
    # Temporary compatibility fixes
    unbuild@3.6.1>typescript: 6.0.3
    tsconfck@3.1.6>typescript: 6.0.3
    '@nuxt/module-builder@1.0.3>typescript': 6.0.3
    mkdist@2.4.1>vue-sfc-transformer: 0.2.5

allowBuilds:
  '@parcel/watcher': true
  '@tailwindcss/oxide': true
  argon2: true
  esbuild: true
  sharp: true
  vue-demi: true

catalog:
  # Architecture
  inversify: 8.2.3
  reflect-metadata: 0.2.2
  zod: 4.4.3

  # Shared
  citty: 0.2.2
  jiti: 2.7.0

  # Frontend
  '@nuxt/ui': 4.10.0
  '@nuxtjs/i18n': 10.6.0
  nuxt: 4.5.2

  # Dev
  '@types/node': 26.2.0
  tsdown: 0.22.14
  turbo: 2.10.9
  typescript: 6.0.3
  unrun: 0.3.1
  vitest: 4.1.10
  vue-tsc: 3.3.9
