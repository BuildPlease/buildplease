# Save exact dependency versions
saveExact: true

# Auto-install resolvable peer dependencies
autoInstallPeers: true

# Fail on invalid or missing peer dependencies
strictPeerDependencies: true

# Do not auto-install before running scripts
verifyDepsBeforeRun: false

# Hoist dependencies for tools that require flat node_modules
shamefullyHoist: false

# Disable minimum package release age
minimumReleaseAge: 0

packages:
  - packages/*
  - packages/*/playground

allowBuilds:
  '@parcel/watcher': true
  '@tailwindcss/oxide': true
  argon2: true
  esbuild: true
  sharp: true
  vue-demi: true

peerDependencyRules:
  allowedVersions:
    unbuild@3.6.1>typescript: 6.0.3
    tsconfck@3.1.6>typescript: 6.0.3
    '@nuxt/module-builder@1.0.3>typescript': 6.0.3
    mkdist@2.4.1>vue-sfc-transformer: 0.2.5

catalog:
  # Shared
  inversify: 8.2.3
  reflect-metadata: 0.2.2
  zod: 4.5.4
  jiti: 2.7.0
  uuid: 14.0.2

  # Frontend
  '@nuxt/ui': 4.11.0
  '@nuxtjs/i18n': 10.6.0
  nuxt: 4.5.2
  vue-tsc: 3.3.11
