packages:
  - packages/*
  - packages/*/playground

# Save exact versions without ^/~ ranges.
saveExact: true

# Hoist dependencies for tools that expect flat node_modules.
shamefullyHoist: true

# Auto-install resolvable peer dependencies.
autoInstallPeers: true

# Fail install on invalid or missing peer dependencies.
strictPeerDependencies: true

# Disable pnpm minimum release age checks for this workspace.
minimumReleaseAge: 0

# Do not auto-run install before scripts.
verifyDepsBeforeRun: false

# Force critical dependencies to one workspace-wide version.
overrides:
  unrun: 0.3.1
  tsdown: 0.22.3
  typescript: 6.0.3

# Allow reviewed dependencies to run install/build scripts.
allowBuilds:
  '@parcel/watcher': true
  '@tailwindcss/oxide': true
  esbuild: true
  nx: true
  sharp: true
  vue-demi: true
